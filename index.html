<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCC by Mel · Bliss Chill and Cheers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{brand:{dark:'#0e0f13',card:'#161820',rose:'#e5a4a4',gold:'#d4af37',border:'#2a2d3d',accent:'#f28e9b'}}}}};
  </script>
  <style>
    body{background-color:#0e0f13;color:#f1f1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
    .modal-bg{background-color:rgba(6,7,10,0.85);backdrop-filter:blur(8px);}
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
  <header class="sticky top-0 z-40 bg-brand-dark/90 backdrop-blur border-b border-brand-border px-4 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="#" onclick="showEventList()" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full border border-brand-rose/40 flex items-center justify-center bg-brand-card font-bold text-xs text-brand-rose">BCC</div>
        <div class="flex flex-col"><span class="font-bold text-base text-white">BCC by Mel</span><span class="text-[10px] tracking-widest uppercase text-gray-400">Bliss Chill and Cheers</span></div>
      </a>
      <div class="flex items-center gap-2">
        <button onclick="openQrModal()" class="p-2 rounded-lg bg-brand-card border border-brand-border text-gray-300 hover:text-white"><i data-lucide="qr-code" class="w-5 h-5"></i></button>
        <button id="adminBtn" onclick="toggleAdmin()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border text-xs font-semibold text-gray-200"><i data-lucide="shield" class="w-4 h-4 text-brand-rose"></i><span id="adminBtnText">Admin</span></button>
        <button id="newEventNavBtn" onclick="openNewEventModal()" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-rose text-brand-dark text-xs font-bold"><i data-lucide="plus-circle" class="w-4 h-4"></i><span>Event erstellen</span></button>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto px-4 py-6 w-full">
    <div id="eventListView" class="space-y-6">
      <div class="text-center py-6 border-b border-brand-border/60">
        <span class="text-xs uppercase tracking-widest text-brand-rose font-semibold">Exklusive Momente & Erlebnisse</span>
        <h1 class="text-3xl sm:text-4xl font-extrabold mt-1 text-white">Event & Foto Archiv</h1>
        <p class="text-sm text-gray-400 mt-2 max-w-md mx-auto">Wähle ein Event aus, sieh dir alle Fotos an oder lade deine Favoriten herunter.</p>
      </div>
      <div id="eventsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <div id="albumView" class="hidden space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-4 border-b border-brand-border/60 pb-4">
        <button onclick="showEventList()" class="flex items-center gap-2 text-xs font-semibold text-gray-400 hover:text-white bg-brand-card px-3 py-1.5 rounded-lg border border-brand-border"><i data-lucide="arrow-left" class="w-4 h-4"></i><span>Alle Events</span></button>
        <div id="albumAdminActions" class="hidden flex items-center gap-2">
          <button onclick="openUploadModal()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-rose text-brand-dark text-xs font-bold"><i data-lucide="upload" class="w-4 h-4"></i><span>Fotos hinzufügen</span></button>
          <button onclick="deleteCurrentEvent()" class="p-1.5 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>
      </div>
      <div>
        <h2 id="albumTitle" class="text-2xl sm:text-3xl font-bold text-white"></h2>
        <div id="albumDateLocation" class="text-xs text-gray-400 mt-1"></div>
        <p id="albumDesc" class="text-sm text-gray-300 mt-2"></p>
      </div>
      <div id="albumChaptersNav" class="flex items-center gap-2 overflow-x-auto pb-2 border-b border-brand-border/40"></div>
      <div id="photosGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
    </div>
  </main>

  <footer class="border-t border-brand-border/60 py-6 text-center text-xs text-gray-500 bg-brand-dark">
    <p class="font-medium text-gray-400">BCC by Mel · Bliss Chill and Cheers</p>
  </footer>

  <!-- Lightbox Modal -->
  <div id="lightboxModal" class="hidden fixed inset-0 z-50 modal-bg flex items-center justify-center p-4">
    <button onclick="closeLightbox()" class="absolute top-4 right-4 text-gray-300 p-2"><i data-lucide="x" class="w-7 h-7"></i></button>
    <button onclick="navigateLightbox(-1)" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-300 p-2"><i data-lucide="chevron-left" class="w-8 h-8"></i></button>
    <button onclick="navigateLightbox(1)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 p-2"><i data-lucide="chevron-right" class="w-8 h-8"></i></button>
    <div class="max-w-4xl max-h-[85vh] flex flex-col items-center">
      <img id="lightboxImg" src="" alt="Vorschau" class="max-w-full max-h-[75vh] object-contain rounded-lg border border-brand-border">
      <a id="lightboxDownloadBtn" href="" download="bcc-foto.jpg" class="mt-3 flex items-center gap-2 px-4 py-2 bg-brand-rose text-brand-dark rounded-lg text-xs font-bold"><i data-lucide="download" class="w-4 h-4"></i><span>Herunterladen</span></a>
    </div>
  </div>

  <!-- QR Modal -->
  <div id="qrModal" class="hidden fixed inset-0 z-50 modal-bg flex items-center justify-center p-4">
    <div class="bg-brand-card border border-brand-border rounded-xl max-w-sm w-full p-6 text-center">
      <h3 class="text-lg font-bold text-white mb-1">Galerie QR-Code</h3>
      <div id="qrCodeContainer" class="p-3 bg-white rounded-lg inline-block mx-auto my-3"></div>
      <button onclick="closeQrModal()" class="w-full py-2 bg-brand-border text-gray-200 text-xs font-semibold rounded-lg">Schließen</button>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="hidden fixed inset-0 z-50 modal-bg flex items-center justify-center p-4">
    <div class="bg-brand-card border border-brand-border rounded-xl max-w-md w-full p-6 space-y-3 text-xs">
      <h3 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="camera" class="w-5 h-5 text-brand-rose"></i><span>Fotos hochladen</span></h3>
      <div><label class="block text-gray-300 mb-1">Kapitel</label><select id="uploadChapterSelect" class="w-full bg-brand-dark border border-brand-border rounded p-2 text-white"></select></div>
      <div><label class="block text-gray-300 mb-1">Fotos</label><input type="file" id="photoFileInput" multiple accept="image/*" class="w-full text-gray-400 bg-brand-dark border border-brand-border rounded p-2"></div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeUploadModal()" class="px-3 py-1.5 text-gray-400">Abbrechen</button>
        <button onclick="processPhotoUpload()" class="px-4 py-1.5 bg-brand-rose text-brand-dark font-bold rounded">Hochladen</button>
      </div>
    </div>
  </div>

  <!-- New Event Modal -->
  <div id="newEventModal" class="hidden fixed inset-0 z-50 modal-bg flex items-center justify-center p-4">
    <div class="bg-brand-card border border-brand-border rounded-xl max-w-md w-full p-6 space-y-3 text-xs">
      <h3 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="calendar-plus" class="w-5 h-5 text-brand-rose"></i><span>Neues Event</span></h3>
      <div><label class="block text-gray-300 mb-1">Titel</label><input type="text" id="eventTitleInput" placeholder="z. B. BCC White Summer Garden Party" class="w-full bg-brand-dark border border-brand-border rounded p-2 text-white"></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="block text-gray-300 mb-1">Datum</label><input type="text" id="eventDateInput" placeholder="12. September 2026" class="w-full bg-brand-dark border border-brand-border rounded p-2 text-white"></div>
        <div><label class="block text-gray-300 mb-1">Ort</label><input type="text" id="eventLocationInput" placeholder="Moerser Brauhaus" class="w-full bg-brand-dark border border-brand-border rounded p-2 text-white"></div>
      </div>
      <div><label class="block text-gray-300 mb-1">Beschreibung</label><textarea id="eventDescInput" rows="2" class="w-full bg-brand-dark border border-brand-border rounded p-2 text-white"></textarea></div>
      <div><label class="block text-gray-300 mb-1">Kapitel (Kommagetrennt)</label><input type="text" id="eventChaptersInput" placeholder="Ankommen, Party, Highlights" class="w-full bg-brand-dark border border-brand-border rounded p-2 text-white"></div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeNewEventModal()" class="px-3 py-1.5 text-gray-400">Abbrechen</button>
        <button onclick="saveNewEvent()" class="px-4 py-1.5 bg-brand-rose text-brand-dark font-bold rounded">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PIN = "1234";
    let isAdmin = false, currentEventId = null, activeChapter = "Alle", currentLightboxList = [], currentLightboxIndex = 0;
    const DEFAULT_EVENTS = [{
      id: "bcc-party", title: "BCC White Moers - Summer Garden Party", date: "12. September 2026", location: "Biergarten Moerser Brauhaus", desc: "Ein Nachmittag in Weiß, gute Musik & Drinks.", cover: "https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?auto=format&fit=crop&w=800&q=80", chapters: ["Alle", "Ankommen", "Party"], photos: [{ url: "https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?auto=format&fit=crop&w=1200&q=80", chapter: "Ankommen" }]
    }];
    let eventsData = JSON.parse(localStorage.getItem('bcc_events_data')) || DEFAULT_EVENTS;
    function saveState() { localStorage.setItem('bcc_events_data', JSON.stringify(eventsData)); }

    document.addEventListener('DOMContentLoaded', () => { renderEventsList(); initQrCode(); lucide.createIcons(); });

    function showEventList() {
      document.getElementById('eventListView').classList.remove('hidden');
      document.getElementById('albumView').classList.add('hidden');
      currentEventId = null;
      renderEventsList();
    }
    function showAlbumView(id) {
      currentEventId = id;
      document.getElementById('eventListView').classList.add('hidden');
      document.getElementById('albumView').classList.remove('hidden');
      activeChapter = "Alle";
      renderAlbumDetail();
    }
    function renderEventsList() {
      const c = document.getElementById('eventsGrid');
      c.innerHTML = '';
      eventsData.forEach(evt => {
        const card = document.createElement('div');
        card.className = "bg-brand-card border border-brand-border rounded-xl overflow-hidden cursor-pointer hover:border-brand-rose transition flex flex-col";
        card.onclick = () => showAlbumView(evt.id);
        card.innerHTML = `
          <div class="h-44 bg-brand-dark overflow-hidden relative">
            <img src="${evt.cover}" class="w-full h-full object-cover">
            <div class="absolute bottom-2 left-2 bg-brand-dark/80 px-2 py-1 rounded text-[10px] text-brand-rose font-bold">${evt.photos ? evt.photos.length : 0} Fotos</div>
          </div>
          <div class="p-4 flex flex-col justify-between flex-grow">
            <div><div class="text-[11px] uppercase tracking-wider text-gray-400 font-semibold mb-1">${evt.date} · ${evt.location||''}</div><h3 class="text-base font-bold text-white mb-1">${evt.title}</h3><p class="text-xs text-gray-400 line-clamp-2">${evt.desc||''}</p></div>
            <div class="mt-4 pt-3 border-t border-brand-border flex items-center justify-between text-xs font-semibold text-brand-rose"><span>Album ansehen</span><i data-lucide="arrow-right" class="w-4 h-4"></i></div>
          </div>`;
        c.appendChild(card);
      });
      lucide.createIcons();
    }
    function renderAlbumDetail() {
      const evt = eventsData.find(e => e.id === currentEventId);
      if (!evt) return showEventList();
      document.getElementById('albumTitle').textContent = evt.title;
      document.getElementById('albumDateLocation').innerHTML = `<i data-lucide="map-pin" class="w-3.5 h-3.5 inline"></i> ${evt.date} · ${evt.location||''}`;
      document.getElementById('albumDesc').textContent = evt.desc || '';
      const nav = document.getElementById('albumChaptersNav');
      nav.innerHTML = '';
      ["Alle", ...(evt.chapters||[]).filter(c=>c!=='Alle')].forEach(chap => {
        const btn = document.createElement('button');
        btn.className = `px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition ${activeChapter===chap?'bg-brand-rose text-brand-dark font-bold':'bg-brand-card border border-brand-border text-gray-400'}`;
        btn.textContent = chap;
        btn.onclick = () => { activeChapter = chap; renderAlbumDetail(); };
        nav.appendChild(btn);
      });
      const grid = document.getElementById('photosGrid');
      grid.innerHTML = '';
      const photos = evt.photos || [];
      const filtered = activeChapter === 'Alle' ? photos : photos.filter(p => p.chapter === activeChapter);
      currentLightboxList = filtered;
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-8 text-center text-xs text-gray-500">Noch keine Fotos hier.</div>`;
      } else {
        filtered.forEach((p, idx) => {
          const item = document.createElement('div');
          item.className = "group relative aspect-square bg-brand-dark rounded-lg overflow-hidden border border-brand-border cursor-pointer";
          item.innerHTML = `<img src="${p.url}" class="w-full h-full object-cover"><div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-2"><button onclick="openLightbox(${idx}); event.stopPropagation();" class="p-1.5 bg-brand-card text-white rounded-full"><i data-lucide="maximize" class="w-4 h-4"></i></button><a href="${p.url}" download="foto.jpg" onclick="event.stopPropagation();" class="p-1.5 bg-brand-rose text-brand-dark rounded-full"><i data-lucide="download" class="w-4 h-4"></i></a></div>`;
          item.onclick = () => openLightbox(idx);
          grid.appendChild(item);
        });
      }
      lucide.createIcons();
    }
    function toggleAdmin() {
      if (!isAdmin) {
        const pin = prompt("Admin-PIN eingeben:");
        if (pin === ADMIN_PIN) { isAdmin = true; updateAdminUI(); }
        else if (pin !== null) alert("Falsche PIN!");
      } else { isAdmin = false; updateAdminUI(); }
    }
    function updateAdminUI() {
      document.getElementById('adminBtnText').textContent = isAdmin ? 'Admin aktiv' : 'Admin';
      document.getElementById('newEventNavBtn').classList.toggle('hidden', !isAdmin);
      if (document.getElementById('albumAdminActions')) document.getElementById('albumAdminActions').classList.toggle('hidden', !isAdmin);
    }
    function openNewEventModal() { document.getElementById('newEventModal').classList.remove('hidden'); }
    function closeNewEventModal() { document.getElementById('newEventModal').classList.add('hidden'); }
    function saveNewEvent() {
      const t = document.getElementById('eventTitleInput').value.trim();
      if (!t) return alert("Titel eingeben!");
      const newId = 'evt-' + Date.now();
      eventsData.unshift({
        id: newId, title: t, date: document.getElementById('eventDateInput').value.trim()||'Demnächst', location: document.getElementById('eventLocationInput').value.trim(), desc: document.getElementById('eventDescInput').value.trim(), cover: "https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?auto=format&fit=crop&w=800&q=80", chapters: ["Alle", ...document.getElementById('eventChaptersInput').value.split(',').map(s=>s.trim()).filter(Boolean)], photos: []
      });
      saveState(); closeNewEventModal(); showAlbumView(newId);
    }
    function deleteCurrentEvent() {
      if (confirm("Event löschen?")) { eventsData = eventsData.filter(e => e.id !== currentEventId); saveState(); showEventList(); }
    }
    function openUploadModal() {
      const evt = eventsData.find(e => e.id === currentEventId);
      if (!evt) return;
      const s = document.getElementById('uploadChapterSelect');
      s.innerHTML = '';
      (evt.chapters||["Highlights"]).filter(c=>c!=='Alle').forEach(c => {
        const o = document.createElement('option'); o.value = c; o.textContent = c; s.appendChild(o);
      });
      document.getElementById('uploadModal').classList.remove('hidden');
    }
    function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); }
    function processPhotoUpload() {
      const fi = document.getElementById('photoFileInput'), ch = document.getElementById('uploadChapterSelect').value, files = Array.from(fi.files);
      if (!files.length) return alert("Wähle Bilder aus!");
      const evt = eventsData.find(e => e.id === currentEventId);
      if (!evt) return;
      if (!evt.photos) evt.photos = [];
      let c = 0;
      files.forEach(f => {
        const r = new FileReader();
        r.onload = (e) => {
          evt.photos.push({ url: e.target.result, chapter: ch });
          c++;
          if (c === files.length) { saveState(); closeUploadModal(); renderAlbumDetail(); }
        };
        r.readAsDataURL(f);
      });
    }
    function openLightbox(idx) {
      currentLightboxIndex = idx;
      const p = currentLightboxList[idx];
      document.getElementById('lightboxImg').src = p.url;
      document.getElementById('lightboxDownloadBtn').href = p.url;
      document.getElementById('lightboxModal').classList.remove('hidden');
    }
    function closeLightbox() { document.getElementById('lightboxModal').classList.add('hidden'); }
    function navigateLightbox(dir) {
      let n = currentLightboxIndex + dir;
      if (n < 0) n = currentLightboxList.length - 1;
      if (n >= currentLightboxList.length) n = 0;
      openLightbox(n);
    }
    function openQrModal() { document.getElementById('qrModal').classList.remove('hidden'); }
    function closeQrModal() { document.getElementById('qrModal').classList.add('hidden'); }
    function initQrCode() {
      const el = document.getElementById('qrCodeContainer');
      el.innerHTML = "";
      new QRCode(el, { text: window.location.href, width: 160, height: 160, colorDark: "#0e0f13", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
    }
  </script>
</body>
</html>
