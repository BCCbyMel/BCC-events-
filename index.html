<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCC by Mel · Bliss Chill and Cheers · Event & Foto Archiv</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0d0b14',
              card: '#161224',
              border: '#2a2245',
              rose: '#d48bb5',
              accent: '#f2a8cc',
              gold: '#cba358'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0d0b14;
      background-image: 
        radial-gradient(at 10% 20%, rgba(229, 115, 175, 0.08) 0px, transparent 50%),
        radial-gradient(at 90% 10%, rgba(212, 139, 181, 0.06) 0px, transparent 50%),
        radial-gradient(at 50% 60%, rgba(242, 168, 204, 0.05) 0px, transparent 50%),
        radial-gradient(at 80% 90%, rgba(139, 92, 246, 0.05) 0px, transparent 50%);
      background-attachment: fixed;
      color: #f1f1f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .bg-brand-card {
      background-color: rgba(22, 18, 36, 0.75);
      backdrop-filter: blur(12px);
    }
    .modal-bg {
      background-color: rgba(6, 4, 10, 0.85);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- Header (Aktionen rechts) -->
  <header class="sticky top-0 z-40 bg-brand-dark/90 backdrop-blur border-b border-brand-border px-4 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-end">
      <div class="flex items-center gap-2">
        <button onclick="openQrModal()" class="p-2 rounded-lg bg-brand-card border border-brand-border text-gray-300 hover:text-white" title="QR-Code">
          <i data-lucide="qr-code" class="w-5 h-5"></i>
        </button>
        <button id="adminBtn" onclick="toggleAdmin()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border text-xs font-semibold text-gray-200">
          <i data-lucide="shield" class="w-4 h-4 text-brand-rose"></i>
          <span id="adminBtnText">Admin</span>
        </button>
        <button id="newEventNavBtn" onclick="openNewEventModal()" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-rose text-brand-dark text-xs font-bold">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>Event erstellen</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl mx-auto px-4 py-6 w-full">
    
    <!-- View 1: Event List -->
    <div id="eventListView" class="space-y-6">
      <div class="text-center py-6 border-b border-brand-border/60">
        <img src="IMG-20260913-WA0016(1).jpg" alt="BCC by Mel Logo" class="w-32 h-32 rounded-full object-cover mx-auto mb-4 border-2 border-brand-rose shadow-lg">
        <span class="text-xs uppercase tracking-widest text-brand-rose font-semibold">Exklusive Momente & Erlebnisse</span>
        <h1 class="text-3xl sm:text-4xl font-extrabold mt-1 text-white">Event & Foto Archiv</h1>
      </div>

      <div id="eventsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- View 2: Album Details -->
    <div id="albumView" class="hidden space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-4 border-b border-brand-border/60 pb-4">
        <button onclick="showEventList()" class="flex items-center gap-2 text-xs font-semibold text-gray-400 hover:text-white">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Zurück zur Übersicht
        </button>
        <div id="albumAdminActions" class="hidden flex items-center gap-2">
          <!-- Titelbild ändern Button -->
          <label class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-card border border-brand-border text-gray-200 text-xs font-semibold cursor-pointer hover:text-white">
            <i data-lucide="image" class="w-4 h-4 text-brand-rose"></i> Titelbild ändern
            <input type="file" accept="image/*" class="hidden" onchange="changeAlbumCover(event)">
          </label>
          <!-- Foto hochladen Button -->
          <button onclick="openUploadModal()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-rose text-brand-dark text-xs font-bold">
            <i data-lucide="upload" class="w-4 h-4"></i> Foto hochladen
          </button>
          <!-- Event löschen Button -->
          <button onclick="deleteCurrentEvent()" class="p-1.5 rounded-lg bg-red-500/20 text-red-400 hover:bg-red-500/30" title="Event löschen">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Album Info Header -->
      <div class="relative rounded-2xl overflow-hidden border border-brand-border">
        <img id="albumCoverImg" src="" alt="Album Cover" class="w-full h-48 sm:h-64 object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-brand-dark via-brand-dark/60 to-transparent p-6 flex flex-col justify-end">
          <h2 id="albumTitle" class="text-2xl sm:text-3xl font-extrabold text-white"></h2>
          <p id="albumDateLocation" class="text-sm text-brand-rose mt-1 font-medium"></p>
          <p id="albumDesc" class="text-gray-300 mt-2 text-sm max-w-2xl"></p>
        </div>
      </div>

      <!-- Photos Grid -->
      <div>
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-bold text-white">Fotos</h3>
          <span id="photoCountBadge" class="text-xs text-gray-400 bg-brand-card px-2.5 py-1 rounded-full border border-brand-border">0 Fotos</span>
        </div>
        <div id="photosGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="mt-auto border-t border-brand-border/60 py-6 text-center text-xs text-gray-500">
    BCC by Mel · Bliss Chill and Cheers
  </footer>

  <!-- Modal: Neues Event (inkl. Titelbild-Upload) -->
  <div id="newEventModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg">
    <div class="bg-brand-card border border-brand-border rounded-2xl p-6 w-full max-w-md space-y-4">
      <h3 class="text-xl font-bold text-white flex items-center gap-2">
        <i data-lucide="calendar-plus" class="w-5 h-5 text-brand-rose"></i> Neues Event erstellen
      </h3>
      <div class="space-y-3">
        <div>
          <label class="text-xs text-gray-400">Titel</label>
          <input id="newEventTitle" type="text" placeholder="z. B. BCC White Summer Garden Party" class="w-full mt-1 px-3 py-2 rounded-lg bg-brand-dark border border-brand-border text-white text-sm focus:outline-none focus:border-brand-rose">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-gray-400">Datum</label>
            <input id="newEventDate" type="text" placeholder="12. September 2026" class="w-full mt-1 px-3 py-2 rounded-lg bg-brand-dark border border-brand-border text-white text-sm focus:outline-none focus:border-brand-rose">
          </div>
          <div>
            <label class="text-xs text-gray-400">Ort</label>
            <input id="newEventLocation" type="text" placeholder="Moerser Brauhaus" class="w-full mt-1 px-3 py-2 rounded-lg bg-brand-dark border border-brand-border text-white text-sm focus:outline-none focus:border-brand-rose">
          </div>
        </div>
        <div>
          <label class="text-xs text-gray-400">Beschreibung</label>
          <textarea id="newEventDesc" rows="2" placeholder="Kurze Beschreibung..." class="w-full mt-1 px-3 py-2 rounded-lg bg-brand-dark border border-brand-border text-white text-sm focus:outline-none focus:border-brand-rose"></textarea>
        </div>
        <div>
          <label class="text-xs text-gray-400">Titelbild / Cover (vom Handy auswählen)</label>
          <input id="newEventCoverInput" type="file" accept="image/*" class="w-full mt-1 text-xs text-gray-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-rose file:text-brand-dark cursor-pointer">
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 pt-2">
        <button onclick="closeNewEventModal()" class="px-4 py-2 rounded-lg text-xs font-semibold text-gray-400 hover:text-white">Abbrechen</button>
        <button onclick="saveNewEventWithCover()" class="px-4 py-2 rounded-lg bg-brand-rose text-brand-dark text-xs font-bold shadow-lg">Speichern</button>
      </div>
    </div>
  </div>

  <!-- Modal: Foto Hochladen -->
  <div id="uploadModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg">
    <div class="bg-brand-card border border-brand-border rounded-2xl p-6 w-full max-w-md space-y-4">
      <h3 class="text-xl font-bold text-white flex items-center gap-2">
        <i data-lucide="upload-cloud" class="w-5 h-5 text-brand-rose"></i> Fotos hochladen
      </h3>
      <div>
        <label class="text-xs text-gray-400">Fotos auswählen</label>
        <input id="photoFileInput" type="file" accept="image/*" multiple class="w-full mt-1 text-xs text-gray-400 file:mr-2 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-rose file:text-brand-dark cursor-pointer">
      </div>
      <div class="flex items-center justify-end gap-2 pt-2">
        <button onclick="closeUploadModal()" class="px-4 py-2 rounded-lg text-xs font-semibold text-gray-400 hover:text-white">Abbrechen</button>
        <button onclick="uploadPhotos()" class="px-4 py-2 rounded-lg bg-brand-rose text-brand-dark text-xs font-bold shadow-lg">Hochladen</button>
      </div>
    </div>
  </div>

  <!-- Modal: QR Code -->
  <div id="qrModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg">
    <div class="bg-brand-card border border-brand-border rounded-2xl p-6 w-full max-w-xs text-center space-y-4">
      <h3 class="text-lg font-bold text-white">Galerie teilen</h3>
      <div id="qrcode" class="p-3 bg-white rounded-xl inline-block shadow-lg"></div>
      <p class="text-xs text-gray-400">QR-Code scannen, um die Galerie direkt auf dem Smartphone zu öffnen.</p>
      <button onclick="closeQrModal()" class="w-full py-2 rounded-lg bg-brand-dark border border-brand-border text-xs font-semibold text-white">Schließen</button>
    </div>
  </div>

  <script>
    const ADMIN_PIN = '1234';
    let isAdmin = false;
    let currentEventId = null;

    const defaultEvents = [
      {
        id: 'event-default-1',
        title: 'BCC White Moers - Summer Garden Party',
        date: '12. September 2026',
        location: 'Moerser Brauhaus',
        description: 'Ein Nachmittag in Weiß, gute Musik & Drinks.',
        cover: 'https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=800&q=80',
        photos: [
          'https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=800&q=80'
        ]
      }
    ];

    let events = JSON.parse(localStorage.getItem('bcc_events')) || defaultEvents;

    function saveEventsToStorage() {
      localStorage.setItem('bcc_events', JSON.stringify(events));
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    function toggleAdmin() {
      if (isAdmin) {
        isAdmin = false;
        updateAdminUI();
      } else {
        const pin = prompt('Admin-PIN eingeben:');
        if (pin === ADMIN_PIN) {
          isAdmin = true;
          updateAdminUI();
        } else if (pin !== null) {
          alert('Falsche PIN!');
        }
      }
    }

    function updateAdminUI() {
      const adminBtn = document.getElementById('adminBtn');
      const adminBtnText = document.getElementById('adminBtnText');
      const newEventNavBtn = document.getElementById('newEventNavBtn');
      const albumAdminActions = document.getElementById('albumAdminActions');

      if (isAdmin) {
        adminBtn.classList.add('bg-brand-rose/20', 'border-brand-rose');
        adminBtnText.innerText = 'Admin aktiv';
        newEventNavBtn.classList.remove('hidden');
        albumAdminActions.classList.remove('hidden');
      } else {
        adminBtn.classList.remove('bg-brand-rose/20', 'border-brand-rose');
        adminBtnText.innerText = 'Admin';
        newEventNavBtn.classList.add('hidden');
        albumAdminActions.classList.add('hidden');
      }
      renderEvents();
    }

    function renderEvents() {
      const grid = document.getElementById('eventsGrid');
      grid.innerHTML = '';

      events.forEach(event => {
        const card = document.createElement('div');
        card.className = 'bg-brand-card border border-brand-border rounded-2xl overflow-hidden shadow-lg flex flex-col group';
        card.innerHTML = `
          <div class="relative h-48 overflow-hidden bg-brand-dark">
            <img src="${event.cover}" alt="${event.title}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
            <span class="absolute top-3 left-3 bg-black/60 backdrop-blur text-[11px] font-semibold text-white px-2.5 py-1 rounded-full border border-white/10">
              ${event.photos.length} Fotos
            </span>
          </div>
          <div class="p-5 flex flex-col flex-grow justify-between space-y-4">
            <div>
              <div class="text-xs font-semibold text-brand-rose uppercase tracking-wider">${event.date} · ${event.location}</div>
              <h3 class="text-lg font-bold text-white mt-1 leading-snug">${event.title}</h3>
              <p class="text-xs text-gray-400 mt-1 line-clamp-2">${event.description || ''}</p>
            </div>
            <button onclick="openAlbum('${event.id}')" class="w-full py-2.5 rounded-xl bg-brand-dark hover:bg-brand-rose/10 border border-brand-border text-xs font-semibold text-white flex items-center justify-between px-4 transition-colors">
              <span>Album ansehen</span>
              <i data-lucide="arrow-right" class="w-4 h-4 text-brand-rose"></i>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
      lucide.createIcons();
    }

    function openAlbum(id) {
      currentEventId = id;
      const event = events.find(e => e.id === id);
      if (!event) return;

      document.getElementById('eventListView').classList.add('hidden');
      document.getElementById('albumView').classList.remove('hidden');

      document.getElementById('albumTitle').innerText = event.title;
      document.getElementById('albumDateLocation').innerText = `${event.date} · ${event.location}`;
      document.getElementById('albumDesc').innerText = event.description || '';
      document.getElementById('albumCoverImg').src = event.cover;
      document.getElementById('photoCountBadge').innerText = `${event.photos.length} Fotos`;

      renderAlbumPhotos(event);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showEventList() {
      currentEventId = null;
      document.getElementById('albumView').classList.add('hidden');
      document.getElementById('eventListView').classList.remove('hidden');
      renderEvents();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderAlbumPhotos(event) {
      const grid = document.getElementById('photosGrid');
      grid.innerHTML = '';

      if (event.photos.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-gray-500 text-sm">Noch keine Fotos in diesem Album.</div>`;
        return;
      }

      event.photos.forEach((photoUrl, index) => {
        const item = document.createElement('div');
        item.className = 'relative group rounded-xl overflow-hidden border border-brand-border bg-brand-dark aspect-square';
        item.innerHTML = `
          <img src="${photoUrl}" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2 p-2">
            <a href="${photoUrl}" download="bcc-foto-${index + 1}.jpg" class="p-2 rounded-lg bg-white/20 hover:bg-white/40 text-white backdrop-blur" title="Herunterladen">
              <i data-lucide="download" class="w-4 h-4"></i>
            </a>
            ${isAdmin ? `
              <button onclick="deletePhoto(${index})" class="p-2 rounded-lg bg-red-500/30 hover:bg-red-500/50 text-red-200 backdrop-blur" title="Löschen">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            ` : ''}
          </div>
        `;
        grid.appendChild(item);
      });
      lucide.createIcons();
    }

    // Modal & Action Handler
    function openNewEventModal() {
      document.getElementById('newEventTitle').value = '';
      document.getElementById('newEventDate').value = '';
      document.getElementById('newEventLocation').value = '';
      document.getElementById('newEventDesc').value = '';
      document.getElementById('newEventCoverInput').value = '';
      document.getElementById('newEventModal').classList.remove('hidden');
    }

    function closeNewEventModal() {
      document.getElementById('newEventModal').classList.add('hidden');
    }

    async function saveNewEventWithCover() {
      const title = document.getElementById('newEventTitle').value.trim();
      const date = document.getElementById('newEventDate').value.trim();
      const location = document.getElementById('newEventLocation').value.trim();
      const desc = document.getElementById('newEventDesc').value.trim();
      const coverInput = document.getElementById('newEventCoverInput');

      if (!title) {
        alert('Bitte gib einen Event-Titel ein!');
        return;
      }

      let coverUrl = 'https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=800&q=80';
      if (coverInput.files && coverInput.files[0]) {
        coverUrl = await readFileAsBase64(coverInput.files[0]);
      }

      const newEvent = {
        id: 'event-' + Date.now(),
        title: title,
        date: date || 'Datum folgt',
        location: location || 'Location folgt',
        description: desc,
        cover: coverUrl,
        photos: []
      };

      events.unshift(newEvent);
      saveEventsToStorage();
      closeNewEventModal();
      renderEvents();
    }

    async function changeAlbumCover(event) {
      const file = event.target.files[0];
      if (!file || !currentEventId) return;

      const base64Cover = await readFileAsBase64(file);
      const targetEvent = events.find(e => e.id === currentEventId);
      if (targetEvent) {
        targetEvent.cover = base64Cover;
        saveEventsToStorage();
        document.getElementById('albumCoverImg').src = base64Cover;
        renderEvents();
      }
    }

    function deleteCurrentEvent() {
      if (!currentEventId) return;
      if (confirm('Möchtest du dieses Event wirklich komplett löschen?')) {
        events = events.filter(e => e.id !== currentEventId);
        saveEventsToStorage();
        showEventList();
      }
    }

    function openUploadModal() {
      document.getElementById('photoFileInput').value = '';
      document.getElementById('uploadModal').classList.remove('hidden');
    }

    function closeUploadModal() {
      document.getElementById('uploadModal').classList.add('hidden');
    }

    async function uploadPhotos() {
      const fileInput = document.getElementById('photoFileInput');
      const files = fileInput.files;
      if (!files || files.length === 0) {
        alert('Bitte wähle mindestens ein Foto aus!');
        return;
      }

      const targetEvent = events.find(e => e.id === currentEventId);
      if (!targetEvent) return;

      for (let i = 0; i < files.length; i++) {
        const base64 = await readFileAsBase64(files[i]);
        targetEvent.photos.push(base64);
      }

      saveEventsToStorage();
      closeUploadModal();
      document.getElementById('photoCountBadge').innerText = `${targetEvent.photos.length} Fotos`;
      renderAlbumPhotos(targetEvent);
    }

    function deletePhoto(index) {
      const targetEvent = events.find(e => e.id === currentEventId);
      if (!targetEvent) return;
      if (confirm('Foto wirklich löschen?')) {
        targetEvent.photos.splice(index, 1);
        saveEventsToStorage();
        document.getElementById('photoCountBadge').innerText = `${targetEvent.photos.length} Fotos`;
        renderAlbumPhotos(targetEvent);
      }
    }

    function openQrModal() {
      document.getElementById('qrcode').innerHTML = '';
      new QRCode(document.getElementById('qrcode'), {
        text: window.location.href,
        width: 160,
        height: 160,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
      document.getElementById('qrModal').classList.remove('hidden');
    }

    function closeQrModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }

    // Init
    renderEvents();
    updateAdminUI();
  </script>
</body>
</html>
